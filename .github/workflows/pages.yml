name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check internal links
        run: |
          set -euo pipefail
          status=0
          for page in *.html; do
            # href="x.html" / href="x.html#anchor" and src="assets/..." references
            for ref in $(grep -oE '(href|src)="[^"#:]+(\.html|\.js|\.css|\.svg|\.png|\.ico|\.webmanifest)(#[^"]*)?"' "$page" | sed -E 's/^(href|src)="//; s/"$//; s/#.*$//' | sort -u); do
              if [ ! -f "$ref" ]; then
                echo "::error file=$page::Broken reference: $ref"
                status=1
              fi
            done
          done
          # Header/footer links injected by layout.js
          for ref in $(grep -oE "'[a-z0-9-]+\.html'" assets/js/layout.js | tr -d "'" | sort -u); do
            if [ ! -f "$ref" ]; then
              echo "::error file=assets/js/layout.js::Broken nav link: $ref"
              status=1
            fi
          done
          exit $status

      - name: Assemble site
        run: |
          mkdir -p _site
          cp *.html .nojekyll robots.txt sitemap.xml favicon.ico site.webmanifest _site/
          cp -R assets _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
